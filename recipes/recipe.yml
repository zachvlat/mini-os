# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mini-os
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/base-main
image-version: 44 # if this tag doesn't exist for base-main, use latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      install-weak-deps: false # keeps Recommends (plasma-welcome, orca, etc.) out
      packages:
        # Plasma shell, no apps
        - plasma-desktop
        - plasma-workspace
        - kwin
        - plasma-systemsettings
        - kscreen
        - powerdevil
        - plasma-breeze
        - breeze-gtk
        - plasma-nm
        - plasma-pa
        - polkit-kde
        - xdg-desktop-portal-kde
        - kde-cli-tools
        - kde-gtk-config
        - kscreenlocker
        - plasma-login-manager
        # services the Plasma panel applets expect (skipped if already present)
        - NetworkManager
        - pipewire-pulseaudio
        - wireplumber
        # CLI tools
        - flatpak
        - wget
        - git
        - podman
        - firewalld
        - micro
        - starship

  - type: systemd
    system:
      enabled:
        - plasmalogin.service
        - firewalld.service
        - NetworkManager.service

  - type: script
    snippets:
      - ln -sf /usr/lib/systemd/system/graphical.target /etc/systemd/system/default.target

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.kde.kwi
      - scope: user

  - type: signing
